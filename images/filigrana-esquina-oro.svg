<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
  <!-- Filigrana Clásica de Orfebrería Francesa para Esquinas de Lujo - Monsieur Flores -->
  <defs>
    <linearGradient id="mfGoldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D59B" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="80%" stop-color="#936F26" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#goldGlow)">
    <!-- Marco perimetral exterior -->
    <path d="M 3 57 L 3 14 C 3 7.925 7.925 3 14 3 L 57 3" stroke="url(#mfGoldFiligree)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Filete interior punteado de alta costura -->
    <path d="M 8 52 L 8 16 C 8 11.582 11.582 8 16 8 L 52 8" stroke="url(#mfGoldFiligree)" stroke-width="0.8" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.85"/>
    <!-- Volutas ornamentales de esquina -->
    <path d="M 12 12 C 19 12 25 18 25 25 C 25 29 21 32 17 30 C 13.5 28 14 22 18 20 C 21 18.5 23 21 22 23" stroke="url(#mfGoldFiligree)" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 12 12 C 12 19 18 25 25 25" stroke="url(#mfGoldFiligree)" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Arabesco vegetal de enlace -->
    <path d="M 14 3 C 14 14 3 14 3 14" stroke="url(#mfGoldFiligree)" stroke-width="0.9" opacity="0.75"/>
    <path d="M 28 3 C 28 10 21 10 21 10" stroke="url(#mfGoldFiligree)" stroke-width="0.8" opacity="0.6"/>
    <path d="M 3 28 C 10 28 10 21 10 21" stroke="url(#mfGoldFiligree)" stroke-width="0.8" opacity="0.6"/>
    <!-- Gemas doradas de acento -->
    <circle cx="12" cy="12" r="2.2" fill="url(#mfGoldFiligree)"/>
    <circle cx="34" cy="8" r="1.4" fill="url(#mfGoldFiligree)"/>
    <circle cx="8" cy="34" r="1.4" fill="url(#mfGoldFiligree)"/>
    <circle cx="57" cy="3" r="2" fill="url(#mfGoldFiligree)"/>
    <circle cx="3" cy="57" r="2" fill="url(#mfGoldFiligree)"/>
  </g>
</svg>