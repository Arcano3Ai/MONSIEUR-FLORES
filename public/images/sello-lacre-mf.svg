<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente de cera de lacre burdeos profunda -->
    <radialGradient id="waxGradient" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#A52438"/>
      <stop offset="35%" stop-color="#831828"/>
      <stop offset="70%" stop-color="#5E0F1B"/>
      <stop offset="100%" stop-color="#3A0810"/>
    </radialGradient>
    
    <!-- Relieve e iluminación dorada para monograma -->
    <linearGradient id="goldMonogram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DC"/>
      <stop offset="30%" stop-color="#E2BE76"/>
      <stop offset="70%" stop-color="#B88A3A"/>
      <stop offset="100%" stop-color="#7A561D"/>
    </linearGradient>

    <!-- Sombra proyectada del sello -->
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Bisel interior de profundidad de cera -->
    <linearGradient id="waxBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Contorno orgánico de cera fundida prensada a mano -->
  <path d="M50 4 
           C63 3, 75 9, 84 18 
           C93 28, 97 40, 96 52 
           C95 65, 89 77, 80 85 
           C70 94, 57 97, 45 96 
           C32 95, 20 89, 13 80 
           C5 70, 3 57, 5 45 
           C7 31, 14 19, 25 11 
           C33 5, 41 4, 50 4 Z" 
        fill="url(#waxGradient)" 
        filter="url(#waxShadow)"/>

  <!-- Capa de brillo y volumen de cera -->
  <path d="M50 4 
           C63 3, 75 9, 84 18 
           C93 28, 97 40, 96 52 
           C95 65, 89 77, 80 85 
           C70 94, 57 97, 45 96 
           C32 95, 20 89, 13 80 
           C5 70, 3 57, 5 45 
           C7 31, 14 19, 25 11 
           C33 5, 41 4, 50 4 Z" 
        fill="url(#waxBevel)"/>

  <!-- Anillo exterior hundido en la cera -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#480B14" stroke-width="2.2" opacity="0.8"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#goldMonogram)" stroke-width="1" stroke-dasharray="2 2" opacity="0.65"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#2B050B" stroke-width="1.2" opacity="0.9"/>

  <!-- Micro flor de lis en la cúspide interior -->
  <g transform="translate(50, 22) scale(0.65)" fill="url(#goldMonogram)">
    <path d="M0 -7 C2 -3 4 -1 0 5 C-4 -1 -2 -3 0 -7 Z"/>
    <path d="M0 1 C2 0 6 0 7 -4 C6 -7 3 -6 1 -3 Z"/>
    <path d="M0 1 C-2 0 -6 0 -7 -4 C-6 -7 -3 -6 -1 -3 Z"/>
    <rect x="-4" y="4" width="8" height="1.2" rx="0.5"/>
  </g>

  <!-- Monograma Clásico Embossado "MF" (Monsieur Flores) -->
  <g fill="url(#goldMonogram)" stroke="#38080F" stroke-width="0.3" style="filter: drop-shadow(0 1px 1px rgba(0,0,0,0.7));">
    <!-- Letra M caligráfica clásica -->
    <path d="M 31 68 L 31 38 C 31 36.5 32 36 33.5 36 C 35 36 36 37 38 41 L 46 56 L 54 41 C 56 37 57 36 58.5 36 C 60 36 61 36.5 61 38 L 61 68 C 61 69.5 59.8 70 58.5 70 C 57.2 70 56 69.5 56 68 L 56 46.5 L 48.5 60.5 C 47.5 62.5 44.5 62.5 43.5 60.5 L 36 46.5 L 36 68 C 36 69.5 34.8 70 33.5 70 C 32.2 70 31 69.5 31 68 Z"/>
    <!-- Letra F ornamentada que entrelaza -->
    <path d="M 52 35 L 68 35 C 69.5 35 70 36 70 37 C 70 38 69.5 39 68 39 L 55 39 L 55 50 L 65 50 C 66.5 50 67 51 67 52 C 67 53 66.5 54 65 54 L 55 54 L 55 68 C 55 69.5 54 70 53 70 C 52 70 51 69.5 51 68 L 51 37 C 51 36 51.5 35 52 35 Z" opacity="0.95"/>
  </g>

  <!-- Pequeño detalle floral inferior -->
  <circle cx="50" cy="76" r="1.8" fill="url(#goldMonogram)"/>
  <circle cx="45" cy="76" r="1" fill="url(#goldMonogram)" opacity="0.7"/>
  <circle cx="55" cy="76" r="1" fill="url(#goldMonogram)" opacity="0.7"/>
</svg>
