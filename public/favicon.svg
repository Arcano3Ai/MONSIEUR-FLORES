<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente de Cera Burdeos de Lacre de Autor -->
    <radialGradient id="favWax" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A52438"/>
      <stop offset="40%" stop-color="#831828"/>
      <stop offset="80%" stop-color="#550E1A"/>
      <stop offset="100%" stop-color="#2D060D"/>
    </radialGradient>

    <!-- Oro Líquido Pulido -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D4"/>
      <stop offset="25%" stop-color="#E2BE76"/>
      <stop offset="65%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#845C22"/>
    </linearGradient>

    <!-- Fondo de Terciopelo Obsidiana -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1C1A"/>
      <stop offset="75%" stop-color="#0E100E"/>
      <stop offset="100%" stop-color="#050605"/>
    </radialGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="url(#favBg)"/>

  <!-- Anillo exterior de oro de filigrana -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#favGold)" stroke-width="1.6" opacity="0.9"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="url(#favGold)" stroke-width="0.8" opacity="0.6"/>

  <!-- Sello de Cera de Lacre -->
  <circle cx="50" cy="50" r="37" fill="url(#favWax)" filter="url(#favGlow)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#favGold)" stroke-width="1" opacity="0.65"/>

  <!-- Monograma MF en Alta Caligrafía Francesa -->
  <text x="50" y="58" 
        text-anchor="middle" 
        font-family="Georgia, 'Playfair Display', serif" 
        font-size="34" 
        font-weight="bold" 
        letter-spacing="1" 
        fill="url(#favGold)" 
        stroke="#420911" 
        stroke-width="0.7">MF</text>

  <!-- Estrella botánica en la base -->
  <text x="50" y="76" 
        text-anchor="middle" 
        font-family="serif" 
        font-size="9" 
        fill="url(#favGold)" 
        opacity="0.9">✦</text>
</svg>

